# Client authentication rules. First matching line wins.
#
# TYPE     DATABASE  USER  ADDRESS     METHOD

# Unix socket inside the container only (used by the image's startup
# scripts and the health check). Not reachable from outside.
local      all       all               trust

# Network connections: SSL required, plus password.
hostssl    all       all   0.0.0.0/0   scram-sha-256
hostssl    all       all   ::/0        scram-sha-256

# Anything without SSL is rejected.
hostnossl  all       all   0.0.0.0/0   reject
hostnossl  all       all   ::/0        reject
